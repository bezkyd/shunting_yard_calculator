<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="theme-toggle"><img src="img/theme-toggle.png" alt="Switch theme toggle"></button>
    <div class="calculator">
        <div class="history-wrapper">
            <button id="toggle-history">📜</button>
            <div id="history-container" class="hidden">
                <div class="history-header">
                    <h4>History</h4>
                </div>
                <ul class="history-list"></ul>
                <button id="clear-history">Clear</button>
            </div>
        </div>
        <div id="previous"></div>
        <input type="text" id="input-field" placeholder="0">   
        <div id="buttons-group">
            <button class="bracket btn">(</button>
            <button class="bracket btn">)</button>

            <button class="top-row-buttons btn">C</button>
            <button class="top-row-buttons btn">DEL</button>
            <button class="top-row-buttons btn">%</button>
            <button class="operator btn">÷</button>

            <button class="btn">7</button>  
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="operator btn">x</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="operator btn">-</button>
            
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="operator btn">+</button>
            
            <button id="zero" class="btn">0</button>
            <button class="btn">.</button>
            <button class="operator btn">=</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
